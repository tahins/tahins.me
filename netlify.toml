[build]
  command = "npm run build"
  publish = "dist"

# Returning visitors still have the Vue CLI PWA worker cached as
# /service-worker.js. Serve the unregistering worker without caching.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# Versioned WOFF2 files in /fonts and hashed Astro assets in /_astro.
# Cache them for a year. Any changed font MUST get a new filename.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# OFL license files sit next to the WOFF2s and must be served as text.
[[headers]]
  for = "/fonts/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Old Vue CLI emitted index.html at this path.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
